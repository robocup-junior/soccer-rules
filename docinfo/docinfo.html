<!--
  Draft marking for the HTML rules. Asciidoctor only injects this file when
  built with `-a docinfo=shared`, which .ci/adoc-to-tex.sh does when the
  DRAFT environment variable is set (see .github/workflows/build.yml).
-->
<style>
:root { --draft-bar: 2.5rem; }
html { scroll-padding-top: calc(var(--draft-bar) + .5rem); }
body { padding-top: var(--draft-bar); }
#toc.toc2 { top: var(--draft-bar) !important; height: calc(100% - var(--draft-bar)) !important; }

.draft-bar {
  position: fixed; inset: 0 0 auto 0; height: var(--draft-bar); z-index: 10000;
  display: flex; align-items: center; justify-content: center; gap: .6em; padding: 0 1rem;
  background: #b3261e; color: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
  font: 600 .95rem/1.2 "Open Sans", "DejaVu Sans", sans-serif;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.draft-bar strong { letter-spacing: .12em; background: #fff; color: #b3261e; padding: .1em .45em; border-radius: 3px; }
.draft-bar a { color: #fff; text-decoration: underline; }

/* Large diagonal watermark, mirroring the draftwatermark package in the PDF.
   Offsets use rem: em would resolve against the watermark's own font size. */
body::after {
  content: "DRAFT"; position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotate(-55deg);
  font: 700 min(26vw, 40vh)/1 "Open Sans", "DejaVu Sans", sans-serif; letter-spacing: .05em;
  color: rgba(200, 0, 0, .08); white-space: nowrap; pointer-events: none; z-index: 9999;
}
@media (min-width: 768px) { body.toc2::after { left: calc(50% + 7.5rem); } }
@media (min-width: 1280px) { body.toc2::after { left: calc(50% + 10rem); } }

@media (max-width: 600px) { .draft-bar .long { display: none; } }
@media print {
  body { padding-top: 0; }
  body::after { left: 50% !important; }
  .draft-bar { position: static; box-shadow: none; }
  .draft-bar, body::after { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
